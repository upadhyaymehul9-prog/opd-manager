name: CI

on:
  # Run on every branch, not just main. CI sat red on main for over a day
  # because nothing exercised it until a push landed there -- by which point
  # main auto-deploys to Vercel, so the gate came too late to be useful.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Referenced by prisma/schema.prisma's `directUrl`. Never connected to
      # in CI, but some Prisma commands validate that every datasource env
      # var resolves before doing anything.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-test-session-secret-min-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub runners; vitest 4 wants
          # ^20.19 || >=22.12 and Next 16 targets 22+.
          node-version: 22
          cache: npm

      # Root cause of the long-standing red CI: package-lock.json was written
      # on Windows, where npm never resolves the Linux-only @emnapi packages
      # that back optional wasm32 fallbacks -- so `npm ci` on this Linux
      # runner failed with EUSAGE ("Missing: @emnapi/runtime ... from lock
      # file"). Fixed by regenerating the lockfile on Linux (see the one-off
      # .github/workflows/relock.yml, now removed). Pinning npm 11 here too,
      # matching the version that wrote it, so the two stay in sync going
      # forward.
      - name: Pin npm to the version that writes the lockfile
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
