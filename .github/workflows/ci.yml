name: CI

on:
  # Run on every branch, not just main. CI sat red on main for over a day
  # because nothing exercised it until a push landed there -- by which point
  # main auto-deploys to Vercel, so the gate came too late to be useful.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Referenced by prisma/schema.prisma's `directUrl`. Never connected to
      # in CI, but some Prisma commands validate that every datasource env
      # var resolves before doing anything.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-test-session-secret-min-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub runners; vitest 4 wants
          # ^20.19 || >=22.12 and Next 16 targets 22+.
          node-version: 22
          cache: npm

      # TEMPORARY DIAGNOSTIC: `npm ci` has failed here for days and the raw
      # log needs auth to read, so mirror the failure into the job summary,
      # which renders on the run's public page. Revert to a plain
      # `npm ci --ignore-scripts` once the cause is known.
      - name: Install dependencies
        run: |
          set +e
          echo "node: $(node -v)   npm: $(npm -v)" | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --ignore-scripts > npm-ci.log 2>&1
          code=$?
          {
            echo ""
            echo "## npm ci exit code: $code"
            echo ""
            echo '```'
            tail -n 80 npm-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 npm-ci.log
          exit $code

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
